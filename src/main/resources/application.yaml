server:
  port: ${NIMBUS_PORT:8081}

spring:
  application:
    name: nimbus

  datasource:
    url: jdbc:postgresql://localhost:5432/nimbus
    username: nimbus
    password: nimbus
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

nimbus:
  jwt:
    # Override in production via NIMBUS_JWT_SECRET. Must be >= 32 bytes for HS256.
    secret: ${NIMBUS_JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long!!}
    expiration-minutes: 60
