server:
  port: ${NIMBUS_PORT:8081}

spring:
  application:
    name: nimbus

  datasource:
    url: jdbc:postgresql://localhost:5432/nimbus
    username: nimbus
    password: nimbus
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

nimbus:
  ratelimit:
    enabled: ${NIMBUS_RATELIMIT_ENABLED:true}
    capacity: ${NIMBUS_RATELIMIT_CAPACITY:100}
    refill-per-second: ${NIMBUS_RATELIMIT_REFILL:20}
  worker:
    poll-interval-ms: ${NIMBUS_WORKER_POLL_MS:200}
    batch-size: ${NIMBUS_WORKER_BATCH_SIZE:50}
  jwt:
    # Override in production via NIMBUS_JWT_SECRET. Must be >= 32 bytes for HS256.
    secret: ${NIMBUS_JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long!!}
    expiration-minutes: 60
