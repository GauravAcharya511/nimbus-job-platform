server:
  port: ${NIMBUS_PORT:8081}

spring:
  application:
    name: nimbus

  datasource:
    url: jdbc:postgresql://localhost:5432/nimbus
    username: nimbus
    password: nimbus
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: nimbus
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.gauravacharya.nimbus.events

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

nimbus:
  events:
    enabled: ${NIMBUS_EVENTS_ENABLED:true}
    topic: ${NIMBUS_EVENTS_TOPIC:nimbus.job.events}
  ratelimit:
    enabled: ${NIMBUS_RATELIMIT_ENABLED:true}
    capacity: ${NIMBUS_RATELIMIT_CAPACITY:100}
    refill-per-second: ${NIMBUS_RATELIMIT_REFILL:20}
  worker:
    poll-interval-ms: ${NIMBUS_WORKER_POLL_MS:200}
    batch-size: ${NIMBUS_WORKER_BATCH_SIZE:50}
  jwt:
    # Override in production via NIMBUS_JWT_SECRET. Must be >= 32 bytes for HS256.
    secret: ${NIMBUS_JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long!!}
    expiration-minutes: 60
