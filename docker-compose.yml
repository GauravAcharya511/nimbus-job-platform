services:
  postgres:
    image: postgres:16-alpine
    container_name: nimbus-postgres
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
    ports:
      - "5432:5432"
    volumes:
      - nimbus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: nimbus-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nimbus
      SPRING_DATASOURCE_USERNAME: nimbus
      SPRING_DATASOURCE_PASSWORD: nimbus
      NIMBUS_JWT_SECRET: dev-only-secret-change-me-min-32-bytes-long!!
      NIMBUS_PORT: 8081
    ports:
      - "8081:8081"

volumes:
  nimbus-pgdata:
